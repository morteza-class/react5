<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>

<body>


    <script>

        const promise = new Promise((resolve, reject) => {
            const isSuccess = false;
            setTimeout(() => {
                if (isSuccess) {
                    resolve('Action was succeeded')
                } else {
                    reject('Action was failed')
                }
            }, 3000);

        });

        promise.then((response) => {
            console.log(response)
        }).catch((error) => {
            console.log(error)
        })

    </script>

</body>

</html>
